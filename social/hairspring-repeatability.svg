<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hairspring timegrapher repeatability</title>
  <desc id="desc">Two mechanical watch rate measurements agree within their uncertainty.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbf8"/>
      <stop offset="1" stop-color="#eee9df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2d2518" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1120" cy="70" r="180" fill="#a8853c" opacity="0.08"/>
  <circle cx="55" cy="610" r="220" fill="#3a5fa8" opacity="0.05"/>

  <g aria-hidden="true">
    <rect x="76" y="70" width="112" height="112" rx="25" fill="#1c1917"/>
    <g fill="#cca85c">
      <circle cx="92" cy="137" r="3.8"/><circle cx="108" cy="133" r="3.8"/>
      <circle cx="124" cy="129" r="3.8"/><circle cx="140" cy="125" r="3.8"/>
      <circle cx="156" cy="121" r="3.8"/><circle cx="172" cy="117" r="3.8"/>
    </g>
    <g fill="#7d9fe0">
      <circle cx="92" cy="116" r="3.8"/><circle cx="108" cy="112" r="3.8"/>
      <circle cx="124" cy="108" r="3.8"/><circle cx="140" cy="104" r="3.8"/>
      <circle cx="156" cy="100" r="3.8"/><circle cx="172" cy="96" r="3.8"/>
    </g>
  </g>
  <text x="216" y="112" fill="#1c1917" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">HAIRSPRING</text>
  <text x="216" y="151" fill="#756d61" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="1.2">WATCH TIMEGRAPHER FOR IPHONE</text>

  <text x="76" y="280" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="600">Measure twice.</text>
  <text x="76" y="360" fill="#a8853c" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-style="italic">See if they agree.</text>
  <text x="80" y="429" fill="#5e574e" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="25">Rate, beat error, amplitude — with the limits stated.</text>

  <g filter="url(#shadow)">
    <rect x="735" y="95" width="385" height="410" rx="28" fill="#ffffff" stroke="#ded6c8" stroke-width="2"/>
    <text x="775" y="151" fill="#756d61" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">VERIFY THE READING</text>
    <line x1="775" y1="176" x2="1080" y2="176" stroke="#e4dfd5" stroke-width="2"/>

    <text x="775" y="232" fill="#756d61" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5">RUN 1</text>
    <text x="1080" y="232" fill="#1c1917" text-anchor="end" font-family="Menlo, Monaco, monospace" font-size="27" font-weight="600">+2.1 ± 0.4 s/d</text>
    <text x="775" y="294" fill="#756d61" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5">RUN 2</text>
    <text x="1080" y="294" fill="#1c1917" text-anchor="end" font-family="Menlo, Monaco, monospace" font-size="27" font-weight="600">+2.3 ± 0.4 s/d</text>

    <line x1="775" y1="330" x2="1080" y2="330" stroke="#e4dfd5" stroke-width="2"/>
    <text x="775" y="372" fill="#756d61" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5">VERDICT</text>
    <text x="775" y="414" fill="#a8853c" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">READINGS AGREE</text>
    <text x="1080" y="447" fill="#756d61" text-anchor="end" font-family="Menlo, Monaco, monospace" font-size="17">0.2 s/d apart · 2.0 limit</text>
    <rect x="775" y="470" width="305" height="8" rx="4" fill="#a8853c" opacity="0.22"/>
  </g>

  <text x="80" y="560" fill="#756d61" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21">One purchase · No subscription · Audio stays on your iPhone</text>
  <text x="1120" y="560" fill="#a8853c" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">Available on the App Store</text>
</svg>
